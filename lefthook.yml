glob_matcher: doublestar

pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,jsx,ts,tsx,json,jsonc}"
      run: npx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    build:
      run: npm run build
    jest:
      run: npm test
    cdk-synth:
      run: npx cdk synth
    knip:
      run: npm run knip
    knip-production:
      run: npm run knip:production
    actionlint:
      glob: ".github/{actions,workflows}/**/*.{yml,yaml}"
      run: ./scripts/actionlint.sh -color

commit-msg:
  commands:
    conventional-commit:
      run: |
        MSG=$(head -1 {1})
        echo "$MSG" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?: .+' || {
          echo "コミットメッセージは Conventional Commits (<type>(<scope>): <要約>) に従ってください: $MSG" >&2
          exit 1
        }
