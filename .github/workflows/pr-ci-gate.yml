name: PR CI Gate
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  biome:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-node-npm
      - run: npx biome ci --reporter=github .

  actionlint:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: ./scripts/actionlint.sh -color
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-node-npm
      - run: npm run build

  test:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-node-npm
      - run: npm test

  knip:
    runs-on: ubuntu-slim
    env:
      KNIP_DISABLE_RAW_TRANSFER: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-node-npm
      - run: npx knip --reporter github-actions

  knip-production:
    runs-on: ubuntu-slim
    env:
      KNIP_DISABLE_RAW_TRANSFER: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-node-npm
      - run: npx knip --production --strict --reporter github-actions

  cdk-synth:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-node-npm
      - run: npx cdk synth
        env:
          AWS_MANAGEMENT_ACCOUNT_ID: '111111111111'
          APEX_DOMAIN_NAME: 'example.com'
          APEX_LANDING_CLOUDFRONT_DOMAIN_NAME: 'd111111abcdef8.cloudfront.net'
          APEX_LANDING_CERT_VALIDATION_RECORD_NAME: '_abc123.example.com.'
          APEX_LANDING_CERT_VALIDATION_RECORD_VALUE: '_xyz789.acm-validations.aws.'

  pr-ci-gate:
    needs:
      - biome
      - actionlint
      - build
      - test
      - knip
      - knip-production
      - cdk-synth
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-slim
    steps:
      - name: Verify CI results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -e '
            all(
              .[];
              .result == "success" or .result == "skipped"
            )
          '
