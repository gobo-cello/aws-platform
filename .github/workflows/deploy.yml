name: Deploy
on:
  push:
    branches:
      - main
    paths:
      - bin/**
      - lib/**
      - .github/workflows/deploy.yml
      - .github/actions/setup-node-npm/**

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  log-archive:
    runs-on: ubuntu-slim
    environment: log-archive
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-node-npm
      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.AWS_LOG_ARCHIVE_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1
      - name: Deploy LogArchiveGithubDeployRoleStack
        run: npx cdk deploy LogArchiveGithubDeployRoleStack --require-approval never
        env:
          AWS_ORGANIZATION_ID: ${{ vars.AWS_ORGANIZATION_ID }}
          AWS_MANAGEMENT_ACCOUNT_ID: ${{ vars.AWS_MANAGEMENT_ACCOUNT_ID }}
          AWS_LOG_ARCHIVE_ACCOUNT_ID: ${{ vars.AWS_LOG_ARCHIVE_ACCOUNT_ID }}
          AWS_SECURITY_OU_ID: ${{ vars.AWS_SECURITY_OU_ID }}
          AWS_PRODUCTION_OU_ID: ${{ vars.AWS_PRODUCTION_OU_ID }}
          AWS_SANDBOX_OU_ID: ${{ vars.AWS_SANDBOX_OU_ID }}
          AWS_CLOUDTRAIL_LOG_BUCKET_NAME: ${{ vars.AWS_CLOUDTRAIL_LOG_BUCKET_NAME }}
          AWS_CLOUDTRAIL_KMS_KEY_ARN: ${{ vars.AWS_CLOUDTRAIL_KMS_KEY_ARN }}
          SECURITY_NOTIFICATION_EMAIL: ${{ vars.SECURITY_NOTIFICATION_EMAIL }}
          APEX_DOMAIN_NAME: ${{ vars.APEX_DOMAIN_NAME }}
          BLOG_SUBDOMAIN_NAME_SERVERS: ${{ vars.BLOG_SUBDOMAIN_NAME_SERVERS }}
          GOOGLE_SITE_VERIFICATION_TOKEN: ${{ vars.GOOGLE_SITE_VERIFICATION_TOKEN }}
      - name: Deploy LogArchiveStack
        run: npx cdk deploy LogArchiveStack --require-approval never
        env:
          AWS_ORGANIZATION_ID: ${{ vars.AWS_ORGANIZATION_ID }}
          AWS_MANAGEMENT_ACCOUNT_ID: ${{ vars.AWS_MANAGEMENT_ACCOUNT_ID }}
          AWS_LOG_ARCHIVE_ACCOUNT_ID: ${{ vars.AWS_LOG_ARCHIVE_ACCOUNT_ID }}
          AWS_SECURITY_OU_ID: ${{ vars.AWS_SECURITY_OU_ID }}
          AWS_PRODUCTION_OU_ID: ${{ vars.AWS_PRODUCTION_OU_ID }}
          AWS_SANDBOX_OU_ID: ${{ vars.AWS_SANDBOX_OU_ID }}
          AWS_CLOUDTRAIL_LOG_BUCKET_NAME: ${{ vars.AWS_CLOUDTRAIL_LOG_BUCKET_NAME }}
          AWS_CLOUDTRAIL_KMS_KEY_ARN: ${{ vars.AWS_CLOUDTRAIL_KMS_KEY_ARN }}
          SECURITY_NOTIFICATION_EMAIL: ${{ vars.SECURITY_NOTIFICATION_EMAIL }}
          APEX_DOMAIN_NAME: ${{ vars.APEX_DOMAIN_NAME }}
          BLOG_SUBDOMAIN_NAME_SERVERS: ${{ vars.BLOG_SUBDOMAIN_NAME_SERVERS }}
          GOOGLE_SITE_VERIFICATION_TOKEN: ${{ vars.GOOGLE_SITE_VERIFICATION_TOKEN }}

  management:
    needs: log-archive
    runs-on: ubuntu-slim
    environment: management
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-node-npm
      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.AWS_MANAGEMENT_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1
      - name: Deploy ManagementGithubDeployRoleStack
        run: npx cdk deploy ManagementGithubDeployRoleStack --require-approval never
        env:
          AWS_ORGANIZATION_ID: ${{ vars.AWS_ORGANIZATION_ID }}
          AWS_MANAGEMENT_ACCOUNT_ID: ${{ vars.AWS_MANAGEMENT_ACCOUNT_ID }}
          AWS_LOG_ARCHIVE_ACCOUNT_ID: ${{ vars.AWS_LOG_ARCHIVE_ACCOUNT_ID }}
          AWS_SECURITY_OU_ID: ${{ vars.AWS_SECURITY_OU_ID }}
          AWS_PRODUCTION_OU_ID: ${{ vars.AWS_PRODUCTION_OU_ID }}
          AWS_SANDBOX_OU_ID: ${{ vars.AWS_SANDBOX_OU_ID }}
          AWS_CLOUDTRAIL_LOG_BUCKET_NAME: ${{ vars.AWS_CLOUDTRAIL_LOG_BUCKET_NAME }}
          AWS_CLOUDTRAIL_KMS_KEY_ARN: ${{ vars.AWS_CLOUDTRAIL_KMS_KEY_ARN }}
          SECURITY_NOTIFICATION_EMAIL: ${{ vars.SECURITY_NOTIFICATION_EMAIL }}
          APEX_DOMAIN_NAME: ${{ vars.APEX_DOMAIN_NAME }}
          BLOG_SUBDOMAIN_NAME_SERVERS: ${{ vars.BLOG_SUBDOMAIN_NAME_SERVERS }}
          GOOGLE_SITE_VERIFICATION_TOKEN: ${{ vars.GOOGLE_SITE_VERIFICATION_TOKEN }}
      - name: Deploy platform stacks
        run: >-
          npx cdk deploy
          OrganizationTrailStack
          AccessAnalyzerStack
          OrganizationPoliciesStack
          SecurityMonitoringStack
          DnsStack
          --require-approval never
        env:
          AWS_ORGANIZATION_ID: ${{ vars.AWS_ORGANIZATION_ID }}
          AWS_MANAGEMENT_ACCOUNT_ID: ${{ vars.AWS_MANAGEMENT_ACCOUNT_ID }}
          AWS_LOG_ARCHIVE_ACCOUNT_ID: ${{ vars.AWS_LOG_ARCHIVE_ACCOUNT_ID }}
          AWS_SECURITY_OU_ID: ${{ vars.AWS_SECURITY_OU_ID }}
          AWS_PRODUCTION_OU_ID: ${{ vars.AWS_PRODUCTION_OU_ID }}
          AWS_SANDBOX_OU_ID: ${{ vars.AWS_SANDBOX_OU_ID }}
          AWS_CLOUDTRAIL_LOG_BUCKET_NAME: ${{ vars.AWS_CLOUDTRAIL_LOG_BUCKET_NAME }}
          AWS_CLOUDTRAIL_KMS_KEY_ARN: ${{ vars.AWS_CLOUDTRAIL_KMS_KEY_ARN }}
          SECURITY_NOTIFICATION_EMAIL: ${{ vars.SECURITY_NOTIFICATION_EMAIL }}
          APEX_DOMAIN_NAME: ${{ vars.APEX_DOMAIN_NAME }}
          BLOG_SUBDOMAIN_NAME_SERVERS: ${{ vars.BLOG_SUBDOMAIN_NAME_SERVERS }}
          GOOGLE_SITE_VERIFICATION_TOKEN: ${{ vars.GOOGLE_SITE_VERIFICATION_TOKEN }}
